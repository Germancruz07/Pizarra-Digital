# Compila la app y la publica en GitHub Pages en cada push a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Si estos secretos del repositorio existen, la app usa cuentas en la nube (Supabase);
      # si no, funciona en modo local. Se configuran en Settings → Secrets and variables → Actions.
      # Nota: la clave publicable acaba en el JavaScript del navegador por diseño; la protección
      # real de los datos son las reglas RLS de supabase/schema.sql.
      - name: Compilar
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_REGION: ${{ vars.VITE_SUPABASE_REGION }}
          VITE_EMAIL_SENDER: ${{ vars.VITE_EMAIL_SENDER }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
